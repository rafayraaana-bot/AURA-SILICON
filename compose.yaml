services:
  aura:
    build:
      context: .
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: 3000
      AURA_DATA_DIR: /app/data
      AURA_CANONICAL_ORIGIN: ${AURA_CANONICAL_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:${AURA_DOCKER_PORT:-3001}:3000"
    volumes:
      - aura-data:/app/data

volumes:
  aura-data:
