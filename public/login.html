<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | AURA SILICON</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/svg+xml" href="/aura-mark.svg" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <div class="brand"><img class="brand-mark" src="/aura-mark.svg" alt="" /><span>AURA SILICON</span></div>
        <h1>Welcome Back</h1>
        <p>Access your semiconductor workspace, jobs, and artifacts.</p>

        <form id="login-form" class="form-grid">
          <div>
            <label class="label" for="login-email">Email</label>
            <input id="login-email" class="input" type="email" name="email" placeholder="name@company.com" required />
          </div>

          <div>
            <label class="label" for="login-password">Password</label>
            <input id="login-password" class="input" type="password" name="password" placeholder="Enter your password" required />
          </div>

          <div class="inline-row">
            <label class="checkbox-row"><input type="checkbox" />Remember me</label>
            <span title="Password recovery is not available yet">Password recovery unavailable</span>
          </div>

          <button class="button primary" type="submit">Sign In</button>

          <div class="auth-divider">or continue with</div>

          <button class="button secondary social-button" type="button" data-auth-provider="google" disabled>Checking Google sign-in…</button>
          <button class="button secondary social-button" type="button" data-auth-provider="github" disabled>Checking GitHub sign-in…</button>
          <button class="button secondary social-button" type="button" disabled>Enterprise SSO unavailable</button>
          <p id="auth-provider-status" class="auth-provider-status" role="status" aria-live="polite"></p>

          <p style="margin:0; text-align:center; color:var(--muted);">
            Don't have an account? <a href="/signup" style="color:var(--accent);">Create account</a>
          </p>
        </form>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
